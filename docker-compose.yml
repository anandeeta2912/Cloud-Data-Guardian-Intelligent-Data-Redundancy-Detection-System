version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: cdg-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password}
      MONGO_INITDB_DATABASE: clouddata-guardian
    volumes:
      - mongodb_data:/data/db
    networks:
      - cdg-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cdg-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - cdg-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile
    container_name: cdg-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env.server
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../server/src:/app/src
    networks:
      - cdg-network

  client:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.client
    container_name: cdg-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ../client/src:/app/src
    networks:
      - cdg-network

volumes:
  mongodb_data:
  redis_data:

networks:
  cdg-network:
    driver: bridge
